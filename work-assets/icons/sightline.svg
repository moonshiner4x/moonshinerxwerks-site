<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="r"><rect width="100" height="100" rx="22"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2b4d"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <radialGradient id="hl" cx=".3" cy=".1" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#E6A817"/></linearGradient>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="100" height="100" fill="url(#bg)"/>
    <rect width="100" height="100" fill="url(#hl)"/>
    <g filter="url(#s)" fill="none" stroke="#e8edf5" stroke-width="5" stroke-linecap="round">
      <circle cx="50" cy="50" r="27"/>
      <line x1="50" y1="14" x2="50" y2="30"/><line x1="50" y1="70" x2="50" y2="86"/>
      <line x1="14" y1="50" x2="30" y2="50"/><line x1="70" y1="50" x2="86" y2="50"/>
    </g>
    <text x="50" y="59.5" filter="url(#s)" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="27" text-anchor="middle" fill="url(#gold)">$</text>
  </g>
</svg>
